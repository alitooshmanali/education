<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>اساطیر آینده</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A2B51; --sand:#D1AB7B; --cream:#F9F6ED; --ink:#132133; --muted:#6B7787;
  --paper:#fff; --line:#E6E1D6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:Vazirmatn,system-ui,sans-serif;background:var(--cream);color:var(--ink);direction:rtl}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none}

/* —— shell —— */
.shell{min-height:100vh;display:flex;flex-direction:column}
.main{flex:1;width:min(1100px,100%);margin:0 auto;padding:0 20px 48px}


/* —— brand ribbon (logo) —— */
.brand-ribbon{
  position:absolute;top:0;inset-inline-start:16px;z-index:100;
  display:flex;flex-direction:column;align-items:center;
  text-decoration:none;pointer-events:auto
}
.brand-ribbon__flag{
  background:#F9F6ED;border-radius:0 0 18px 18px;
  box-shadow:0 12px 32px rgba(6,29,56,.32);
  padding:14px 16px 12px;border:1px solid rgba(255,255,255,.65);
  border-top:0;min-width:110px;text-align:center
}
.brand-ribbon__flag img{
  width:88px;height:88px;object-fit:contain;display:block;margin:0 auto
}
.brand-ribbon__name{
  margin-top:6px;font-size:11px;font-weight:800;letter-spacing:.2px;
  color:#0A2B51;line-height:1.25
}
.brand-ribbon__name span{display:block;font-size:9.5px;font-weight:600;color:#6B7787;margin-top:2px}

/* —— carousel —— */
.carousel{
  position:relative;width:100%;height:min(52vw,480px);min-height:280px;
  overflow:hidden;background:#061d38;direction:ltr
}
.carousel__track{
  display:flex;height:100%;width:100%;
  transition:transform .75s cubic-bezier(.4,0,.2,1);
  will-change:transform;direction:ltr
}
.carousel__slide{
  flex:0 0 100%;width:100%;height:100%;position:relative;
  background:#061d38
}
.carousel__slide img{
  width:100%;height:100%;object-fit:cover;object-position:center;
  display:block
}
.carousel__caption{
  position:absolute;inset:auto 0 0 0;display:flex;align-items:flex-end;justify-content:center;
  text-align:center;padding:40px 20px 44px;color:#fff;
  background:linear-gradient(transparent 0%, rgba(6,29,56,.55) 40%, rgba(6,29,56,.92) 100%);
  pointer-events:none;direction:rtl
}
.carousel__caption h2{font-size:clamp(22px,4vw,40px);font-weight:900;letter-spacing:-.3px;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.carousel__caption p{margin-top:8px;font-size:14px;opacity:.95;font-weight:600;text-shadow:0 1px 8px rgba(0,0,0,.45)}
.carousel__dots{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  display:flex;gap:8px;z-index:5;direction:ltr
}
.carousel__dots button{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.45);border:0;padding:0;cursor:pointer}
.carousel__dots button.is-on{background:#D1AB7B;width:22px;border-radius:999px}
.carousel{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.carousel__track{cursor:grab;will-change:transform}
.carousel__track.is-dragging{cursor:grabbing;transition:none!important}
.carousel__arrow{
  position:absolute;top:50%;transform:translateY(-50%);z-index:12;
  width:40px;height:40px;border-radius:50%;border:0;
  background:rgba(255,255,255,.92);color:#0A2B51;
  font-size:22px;font-weight:700;line-height:1;
  display:grid;place-items:center;cursor:pointer;
  box-shadow:0 4px 16px rgba(6,29,56,.25)
}
.carousel__arrow--prev{left:10px}
.carousel__arrow--next{right:10px}

/* —— circles —— */
.circles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;margin:40px 0 24px;justify-items:center}
.circle{
  width:min(180px,22vw);aspect-ratio:1;border-radius:50%;overflow:hidden;position:relative;
  border:3px solid #fff;box-shadow:0 12px 36px rgba(10,43,81,.14);
  cursor:pointer;transition:transform .25s ease,box-shadow .25s ease;isolation:isolate
}
.circle:hover{transform:translateY(-6px) scale(1.03);box-shadow:0 18px 44px rgba(10,43,81,.2)}
.circle img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.circle__label{
  position:absolute;inset-inline:0;bottom:0;padding:28px 8px 14px;
  background:linear-gradient(transparent,rgba(6,29,56,.85));
  color:#fff;text-align:center;font-size:13px;font-weight:800
}
.circle--sm{width:min(160px,28vw)}

/* —— section title —— */
.sec-title{text-align:center;margin:28px 0 8px}
.sec-title h1{font-size:clamp(22px,3vw,32px);font-weight:900;color:var(--navy)}
.sec-title p{color:var(--muted);font-size:13.5px;margin-top:6px}

/* —— list grid for library items —— */
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:22px;margin:28px 0;justify-items:center}
.lib-empty{text-align:center;color:var(--muted);padding:40px 12px;font-size:14px}

/* —— podcast / library circles playing state —— */
.circle.is-playing{box-shadow:0 0 0 4px var(--sand),0 14px 40px rgba(10,43,81,.2)}
.circle.is-playing .circle__label{background:var(--sand);color:var(--navy)}

/* —— circular progress around podcast —— */
.circle-wrap{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  text-decoration:none;color:inherit;cursor:pointer
}
.circle-stage{
  position:relative;display:grid;place-items:center;
  width:min(180px,22vw);aspect-ratio:1
}
.circle-stage .circle{
  width:100% !important;position:relative;z-index:1
}
.circle-ring{
  position:absolute;inset:-10px;width:calc(100% + 20px);height:calc(100% + 20px);
  transform:rotate(-90deg);pointer-events:none;z-index:2
}
.circle-ring circle{
  fill:none;stroke-width:3.5;cx:50;cy:50;r:46
}
.circle-ring .ring-bg{stroke:rgba(10,43,81,.12)}
.circle-ring .ring-fg{
  stroke:var(--sand);stroke-linecap:round;
  stroke-dasharray:289.027;stroke-dashoffset:289.027;
  transition:stroke-dashoffset .15s linear
}
.circle-wrap.is-playing .ring-fg{stroke:#0A2B51}
.circle-wrap.is-playing .circle{box-shadow:0 8px 28px rgba(10,43,81,.18)}
.circle-time{
  font-size:11.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;
  min-height:1.2em;opacity:0;transition:opacity .2s
}
.circle-wrap.is-playing .circle-time,
.circle-wrap.has-progress .circle-time{opacity:1;color:var(--navy)}


/* —— detail page (podcast with text) —— */
.detail{max-width:720px;margin:0 auto 48px;padding:0 16px}
.detail__hero{
  width:100vw;margin-right:calc(50% - 50vw);margin-left:calc(50% - 50vw);
  height:min(42vw,360px);min-height:220px;overflow:hidden;background:var(--navy)
}
.detail__hero img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.detail__title{
  text-align:center;margin:22px 0 6px;font-size:clamp(22px,3.5vw,32px);
  font-weight:900;color:var(--navy);line-height:1.35
}
.detail__summary{text-align:center;color:var(--muted);font-size:13.5px;margin:0 0 16px}
.detail__player{
  margin:0 auto 18px;padding:14px 16px;border-radius:16px;background:#fff;
  border:1px solid var(--line);box-shadow:0 8px 28px rgba(10,43,81,.06)
}
.detail__player audio{width:100%;display:block}
.detail__player audio::-webkit-media-controls-download-button{display:none}
.detail__body-card{
  margin-top:4px;padding:24px 22px;border-radius:16px;background:#fff;
  border:1px solid var(--line);box-shadow:0 8px 28px rgba(10,43,81,.05)
}
/* video watch page */
.video-watch{display:grid;grid-template-columns:minmax(0,1fr) min(320px,34vw);gap:20px;align-items:start;margin:20px 0 40px}
.video-watch__player{background:#000;border-radius:16px;overflow:hidden;aspect-ratio:16/9}
.video-watch__player video{width:100%;height:100%;display:block;background:#000}
.video-watch__side{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;max-height:min(70vh,560px);overflow:auto}
.video-watch__side h3{font-size:14px;font-weight:900;color:var(--navy);margin:0 0 10px}
.video-watch__group{margin-bottom:14px}
.video-watch__group-label{font-size:11px;font-weight:800;color:var(--muted);margin-bottom:8px}
.video-watch__item{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;cursor:pointer;border:1px solid transparent}
.video-watch__item:hover,.video-watch__item.is-on{background:#f5f3ec;border-color:var(--line)}
.video-watch__item img{width:72px;height:48px;object-fit:cover;border-radius:8px;background:#eef3fa;flex-shrink:0}
.video-watch__item span{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.35}
.video-watch__title{font-size:clamp(20px,3vw,28px);font-weight:900;color:var(--navy);margin:12px 0 6px}
.video-watch__sum{color:var(--muted);font-size:13.5px;margin-bottom:12px}
.circle-preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;z-index:3;background:#000}
.circle-stage{overflow:visible}
@media(max-width:900px){
  .video-watch{grid-template-columns:1fr}
  .video-watch__side{max-height:none}
}
.detail__body{
  text-align:justify;text-justify:inter-word;line-height:2.05;
  font-size:15.5px;color:var(--ink);white-space:pre-wrap;margin:0
}

/* floating mini player */
.site-player{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;
  width:min(420px,92vw);background:#0A2B51;color:#fff;border-radius:16px;
  box-shadow:0 16px 48px rgba(6,29,56,.35);padding:12px 14px;display:none;align-items:center;gap:12px
}
.site-player.is-on{display:flex}
.site-player__meta{flex:1;min-width:0}
.site-player__title{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.site-player__sub{font-size:11px;opacity:.75;margin-top:2px}
.site-player audio{flex:1.2;min-width:0;height:36px;filter:invert(1) hue-rotate(180deg);opacity:.95}
.site-player__close{background:transparent;border:0;color:#fff;font-size:18px;cursor:pointer;padding:4px 8px;opacity:.8}
.back{
  display:inline-flex;align-items:center;gap:6px;margin:18px 0 0;padding:8px 16px;border-radius:999px;
  border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--navy);background:#fff
}
.back:hover{background:#eef3fa}

/* —— hero image only (no carousel) —— */
.hero-still{width:100%;height:min(36vw,300px);min-height:180px;overflow:hidden;background:var(--navy)}
.hero-still img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}

/* —— footer —— */
.footer{
  margin-top:auto;background:var(--navy);color:rgba(242,245,249,.78);
  padding:28px 20px;text-align:center;font-size:12.5px
}
.footer strong{display:block;color:#fff;font-size:14px;margin-bottom:6px}
.footer a{color:var(--sand);font-weight:700}



/* —— tablet —— */
@media (max-width:900px){
  .carousel{height:min(56vw,360px);min-height:220px}
  .brand-ribbon{inset-inline-start:10px}
  .brand-ribbon__flag{min-width:88px;padding:10px 12px 10px}
  .brand-ribbon__flag img{width:72px;height:72px}
  .brand-ribbon__name{font-size:10px}
  .brand-ribbon__name span{font-size:8.5px}
  .main{padding:0 14px 40px}
  .detail{padding:0 12px}
  .detail__hero{height:min(48vw,280px);min-height:180px}
}

/* —— mobile —— */
@media (max-width:720px){
  .brand-ribbon{inset-inline-start:8px}
  .brand-ribbon__flag{
    min-width:72px;padding:8px 10px 8px;border-radius:0 0 14px 14px;
    box-shadow:0 8px 22px rgba(6,29,56,.28)
  }
  .brand-ribbon__flag img{width:56px;height:56px}
  .brand-ribbon__name{font-size:9px;margin-top:4px}
  .brand-ribbon__name span{font-size:7.5px;letter-spacing:0}

  .carousel{height:min(62vw,300px);min-height:200px}
  .carousel__caption{padding:28px 14px 36px}
  .carousel__caption h2{font-size:clamp(18px,5.5vw,26px)}
  .carousel__caption p{font-size:12px}
  .carousel__dots{bottom:10px;gap:6px}
  .carousel__arrow{width:34px;height:34px;font-size:18px}
  .carousel__arrow--prev{left:6px}
  .carousel__arrow--next{right:6px}

  .hero-still{height:min(48vw,240px);min-height:160px}

  .main{padding:0 12px 36px}
  .sec-title{margin:20px 0 6px}
  .sec-title h1{font-size:clamp(18px,5vw,26px)}
  .sec-title p{font-size:12.5px}

  .circles{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:16px 12px;margin:20px 0;justify-items:center
  }
  .circle{width:min(148px,42vw)}
  .circle-stage{width:min(148px,42vw)}
  .circle__label{font-size:12px;padding:8px 6px}
  .circle-time{font-size:10.5px}

  .detail{padding:0 10px 32px;margin-bottom:32px}
  .detail__hero{height:min(52vw,260px);min-height:160px}
  .detail__title{font-size:clamp(18px,5vw,26px);margin:16px 0 4px}
  .detail__summary{font-size:12.5px;margin-bottom:12px}
  .detail__player{padding:10px 12px;border-radius:12px;margin-bottom:14px}
  .detail__body-card{padding:16px 14px;border-radius:12px}
  /* video watch page */
.video-watch{display:grid;grid-template-columns:minmax(0,1fr) min(320px,34vw);gap:20px;align-items:start;margin:20px 0 40px}
.video-watch__player{background:#000;border-radius:16px;overflow:hidden;aspect-ratio:16/9}
.video-watch__player video{width:100%;height:100%;display:block;background:#000}
.video-watch__side{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;max-height:min(70vh,560px);overflow:auto}
.video-watch__side h3{font-size:14px;font-weight:900;color:var(--navy);margin:0 0 10px}
.video-watch__group{margin-bottom:14px}
.video-watch__group-label{font-size:11px;font-weight:800;color:var(--muted);margin-bottom:8px}
.video-watch__item{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;cursor:pointer;border:1px solid transparent}
.video-watch__item:hover,.video-watch__item.is-on{background:#f5f3ec;border-color:var(--line)}
.video-watch__item img{width:72px;height:48px;object-fit:cover;border-radius:8px;background:#eef3fa;flex-shrink:0}
.video-watch__item span{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.35}
.video-watch__title{font-size:clamp(20px,3vw,28px);font-weight:900;color:var(--navy);margin:12px 0 6px}
.video-watch__sum{color:var(--muted);font-size:13.5px;margin-bottom:12px}
.circle-preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;z-index:3;background:#000}
.circle-stage{overflow:visible}
@media(max-width:900px){
  .video-watch{grid-template-columns:1fr}
  .video-watch__side{max-height:none}
}
.detail__body{font-size:14.5px;line-height:1.95}

  .site-player{
    bottom:10px;width:calc(100% - 20px);max-width:none;
    border-radius:14px;padding:10px 12px;gap:8px;flex-wrap:wrap
  }
  .site-player audio{width:100%;flex:1 1 100%;order:3}
  .site-player__meta{flex:1;min-width:0}
  .site-player__title{font-size:12px}
  .site-player__sub{font-size:10px}

  .footer{padding:22px 14px 28px;font-size:11.5px}
  .footer img{width:40px!important;height:40px!important}
  .back{font-size:12.5px;padding:7px 14px}
}

@media (max-width:380px){
  .brand-ribbon__flag{min-width:64px;padding:6px 8px}
  .brand-ribbon__flag img{width:48px;height:48px}
  .brand-ribbon__name{display:none} /* logo only on very small; image still has text */
  .circle{width:min(130px,44vw)}
  .circle-stage{width:min(130px,44vw)}
}

/* safe area (notch phones) */
@supports (padding:max(0px)){
  .brand-ribbon{top:0}
  .site-player{bottom:max(10px, env(safe-area-inset-bottom))}
  .footer{padding-bottom:max(28px, env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div class="shell">
  <a class="brand-ribbon" href="#/" title="اساطیر آینده" id="site-brand-ribbon">
    <span class="brand-ribbon__flag">
      <img src="/site/img/logo.png" alt="اساطیر آینده" width="88" height="88">
      <div class="brand-ribbon__name">اساطیر آینده<span>asatir-e ayande</span></div>
    </span>
  </a>
  <div id="app"></div>
  <div class="site-player" id="site-player">
    <div class="site-player__meta">
      <div class="site-player__title" id="sp-title">در حال پخش</div>
      <div class="site-player__sub">پادکست · فقط پخش</div>
    </div>
    <audio id="audio-el" controls controlsList="nodownload noplaybackrate" oncontextmenu="return false"></audio>
    <button type="button" class="site-player__close" id="sp-close" aria-label="بستن">×</button>
  </div>
  <footer class="footer">
    <img src="/site/img/logo.png" alt="" style="width:48px;height:48px;object-fit:contain;margin:0 auto 10px;display:block;border-radius:50%;background:#fff;padding:4px">
    <strong>اساطیر آینده</strong>
    آموزشگاه زبان و مهارت
    · <a href="/login">ورود به پلتفرم</a>
  </footer>
</div>
<script>
/* —— image assets (Unsplash, thematic) —— */
const IMG = {
  /* کروسل — فایل‌ها را در wwwroot/site/img/ بگذار */
  lang:   '/site/img/carousel-english.svg',
  paint:  '/site/img/carousel-painting.svg',
  music:  '/site/img/carousel-music.svg',
  code:   '/site/img/carousel-computer.svg',
  /* دایره‌های صفحه اصلی */
  book:   '/site/img/circle-english.svg',
  artist: '/site/img/circle-painting.svg',
  coder:  '/site/img/circle-computer.svg',
  guitar: '/site/img/circle-music.svg',
  /* بخش زبان انگلیسی */
  headph: '/site/img/circle-podcast.svg',
  story:  '/site/img/circle-stories.svg',
  concert:'/site/img/circle-musics.svg',
  oxford: '/site/img/circle-books.svg',
};

const CAROUSEL = [
  { img: IMG.lang,  title: 'زبان انگلیسی', sub: 'مسیر یادگیری از پایه تا پیشرفته' },
  { img: IMG.paint, title: 'نقاشی',        sub: 'خلاقیت روی بوم' },
  { img: IMG.music, title: 'موسیقی',       sub: 'ریتم، ساز و اجرا' },
  { img: IMG.code,  title: 'کامپیوتر',     sub: 'کد، ابزار و مهارت دیجیتال' },
];

const HOME_CIRCLES = [
  { id:'english',  label:'زبان انگلیسی', img: IMG.book,   route:'#/english' },
  { id:'painting', label:'نقاشی',         img: IMG.artist, route:'#/painting' },
  { id:'computer', label:'کامپیوتر',      img: IMG.coder,  route:'#/computer' },
  { id:'music',    label:'موسیقی',        img: IMG.guitar, route:'#/music-skill' },
];

const ENGLISH_CIRCLES = [
  { id:'podcast', label:'پادکست',  img: IMG.headph,  route:'#/english/podcast' },
  { id:'videos',  label:'فیلم‌ها',   img: IMG.code,    route:'#/english/videos' },
  { id:'stories', label:'داستان',  img: IMG.story,   route:'#/english/stories' },
  { id:'musics',  label:'موسیقی',  img: IMG.concert, route:'#/english/musics' },
  { id:'books',   label:'کتاب',    img: IMG.oxford,  route:'#/english/books' },
];


async function fetchPage(pageKey){
  try{
    const r = await fetch('/api/site/pages/' + encodeURIComponent(pageKey));
    if(!r.ok) return null;
    return await r.json();
  }catch{ return null; }
}

function slotsToCarousel(page){
  if(!page || !page.carousel || !page.carousel.length) return null;
  return page.carousel.map(s => ({
    img: s.imageUrl || IMG.lang,
    title: s.title || '',
    sub: s.subtitle || ''
  }));
}

function inferCircleRoute(title, fallback, index){
  const t = (title || '').trim();
  const rules = [
    [/پادکست|podcast/i, '#/english/podcast'],
    [/فیلم|video/i, '#/english/videos'],
    [/داستان|stor/i, '#/english/stories'],
    [/کتاب|book/i, '#/english/books'],
    [/انگلیس|english/i, '#/english'],
    [/نقاش|paint|art/i, '#/painting'],
    [/کامپیوتر|computer|code/i, '#/computer'],
    [/موسیقی.*انگلیس|musics/i, '#/english/musics'],
    [/موسیقی|music/i, '#/music-skill'],
  ];
  for(const [re, route] of rules){
    if(re.test(t)) return route;
  }
  if(fallback && fallback[index] && fallback[index].route) return fallback[index].route;
  return null;
}

function slotsToCircles(page, fallback){
  if(!page || !page.circles || !page.circles.length) return fallback;
  return page.circles.map((s, i) => {
    let route = (s.linkHref || '').trim();
    if(!route || route === '#' || route === '#/'){
      route = inferCircleRoute(s.title, fallback, i) || (fallback[i] && fallback[i].route) || '#/';
    }
    const fb = fallback && fallback[i];
    return {
      id: String(s.id),
      label: s.title || (fb && fb.label) || '',
      img: s.imageUrl || (fb && fb.img) || IMG.book,
      route
    };
  });
}

const CAT = { podcast:1, stories:2, musics:3, books:4, videos:5 };
const CAT_NAME = { podcast:'پادکست', stories:'داستان', musics:'موسیقی', books:'کتاب', videos:'فیلم‌های آموزشی' };
const CAT_HERO = { podcast:IMG.headph, stories:IMG.story, musics:IMG.concert, books:IMG.oxford, videos:IMG.code };

const app = document.getElementById('app');
const audioEl = document.getElementById('audio-el');
let carouselTimer = null;

function stopCarousel(){ if(carouselTimer){ clearInterval(carouselTimer); carouselTimer=null; } }

function renderCarousel(slides){
  const data = (slides && slides.length) ? slides : CAROUSEL;
  let i = 0;
  const html = `
  <div class="carousel" id="carousel">
    <div class="carousel__track" id="c-track">
      ${data.map(s=>`
        <div class="carousel__slide">
          <img src="${s.img}" alt="${s.title||''}" loading="eager"
               onerror="this.style.opacity='.3'" draggable="false">
          <div class="carousel__caption"><div>
            <h2>${s.title||''}</h2>
            ${s.sub?`<p>${s.sub}</p>`:''}
          </div></div>
        </div>`).join('')}
    </div>
    <button type="button" class="carousel__arrow carousel__arrow--prev" id="c-prev" aria-label="قبلی">‹</button>
    <button type="button" class="carousel__arrow carousel__arrow--next" id="c-next" aria-label="بعدی">›</button>
    <div class="carousel__dots" id="c-dots">
      ${data.map((_,d)=>`<button type="button" data-i="${d}" class="${d===0?'is-on':''}" aria-label="slide ${d+1}"></button>`).join('')}
    </div>
  </div>`;
  requestAnimationFrame(()=>{
    const root = document.getElementById('carousel');
    const track = document.getElementById('c-track');
    const dots = document.getElementById('c-dots');
    if(!track||!dots||!root) return;

    const go = (n)=>{
      i = ((n % data.length) + data.length) % data.length;
      track.style.transition = 'transform .35s ease';
      track.style.transform = 'translate3d(' + (-i * 100) + '%,0,0)';
      dots.querySelectorAll('button').forEach((b,bi)=>b.classList.toggle('is-on', bi===i));
    };

    const start = ()=>{
      stopCarousel();
      if(data.length > 1){
        carouselTimer = setInterval(()=>go(i+1), 4800);
      }
    };

    go(0);
    dots.querySelectorAll('button').forEach(b=>{
      b.addEventListener('click', ()=>{ stopCarousel(); go(+b.dataset.i); start(); });
    });
    document.getElementById('c-prev')?.addEventListener('click', ()=>{ stopCarousel(); go(i-1); start(); });
    document.getElementById('c-next')?.addEventListener('click', ()=>{ stopCarousel(); go(i+1); start(); });

    /* —— touch / pointer swipe (mobile + desktop drag) —— */
    let startX = 0, startY = 0, deltaX = 0, dragging = false, axis = null;
    const threshold = 40; // px

    const onDown = (clientX, clientY)=>{
      if(data.length < 2) return;
      dragging = true;
      axis = null;
      startX = clientX;
      startY = clientY;
      deltaX = 0;
      stopCarousel();
      track.classList.add('is-dragging');
      track.style.transition = 'none';
    };
    const onMove = (clientX, clientY)=>{
      if(!dragging) return;
      const dx = clientX - startX;
      const dy = clientY - startY;
      if(axis === null){
        if(Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
        axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
        if(axis === 'y'){ dragging = false; track.classList.remove('is-dragging'); return; }
      }
      if(axis !== 'x') return;
      deltaX = dx;
      const pct = (deltaX / root.offsetWidth) * 100;
      track.style.transform = 'translate3d(' + ((-i * 100) + pct) + '%,0,0)';
    };
    const onUp = ()=>{
      if(!dragging && axis !== 'x'){ track.classList.remove('is-dragging'); return; }
      track.classList.remove('is-dragging');
      dragging = false;
      if(Math.abs(deltaX) > threshold){
        go(deltaX < 0 ? i + 1 : i - 1);
      } else {
        go(i);
      }
      deltaX = 0;
      axis = null;
      start();
    };

    // Pointer events (covers touch + mouse)
    root.addEventListener('pointerdown', e=>{
      if(e.button !== undefined && e.button !== 0) return;
      if(e.target.closest('.carousel__arrow, .carousel__dots')) return;
      onDown(e.clientX, e.clientY);
      try{ root.setPointerCapture(e.pointerId); }catch(_){}
    });
    root.addEventListener('pointermove', e=>{
      if(!dragging) return;
      onMove(e.clientX, e.clientY);
    });
    root.addEventListener('pointerup', onUp);
    root.addEventListener('pointercancel', onUp);
    root.addEventListener('pointerleave', e=>{
      if(dragging) onUp();
    });

    // Fallback touch for older browsers
    root.addEventListener('touchstart', e=>{
      if(!e.touches[0]) return;
      if(e.target.closest('.carousel__arrow, .carousel__dots')) return;
      onDown(e.touches[0].clientX, e.touches[0].clientY);
    }, {passive:true});
    root.addEventListener('touchmove', e=>{
      if(!dragging || axis !== 'x' || !e.touches[0]) return;
      onMove(e.touches[0].clientX, e.touches[0].clientY);
      if(axis === 'x') e.preventDefault();
    }, {passive:false});
    root.addEventListener('touchend', onUp);
    root.addEventListener('touchcancel', onUp);

    start();
  });
  return html;
}

function circlesHtml(items, sm=false){
  return `<div class="circles">${items.map(c=>`
    <a class="circle ${sm?'circle--sm':''}" href="${c.route}" data-route="${c.route}">
      <img src="${c.img}" alt="${c.label}" loading="lazy">
      <span class="circle__label">${c.label}</span>
    </a>`).join('')}</div>`;
}

async function fetchLibrary(category){
  try{
    const r = await fetch(`/api/site/library?category=${category}`);
    if(!r.ok) return [];
    return await r.json();
  }catch{ return []; }
}

const sitePlayer = document.getElementById('site-player');
const spTitle = document.getElementById('sp-title');
const CIRC = 2 * Math.PI * 46; // r=46

function fmtTime(sec){
  if(!isFinite(sec) || sec < 0) return '۰:۰۰';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  const raw = m + ':' + String(s).padStart(2,'0');
  return raw.replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
}

function setRingProgress(wrap, ratio){
  if(!wrap) return;
  const fg = wrap.querySelector('.ring-fg');
  if(!fg) return;
  const r = Math.max(0, Math.min(1, ratio || 0));
  fg.style.strokeDasharray = String(CIRC);
  fg.style.strokeDashoffset = String(CIRC * (1 - r));
}

function clearAllPlaying(){
  document.querySelectorAll('.circle-wrap.is-playing, .circle.is-playing').forEach(el=>{
    el.classList.remove('is-playing');
  });
}

document.getElementById('sp-close')?.addEventListener('click', ()=>{
  stopInlinePlayer();
});

let _activeWrap = null;

function playAudio(url, title, wrapEl){
  if(!url) return;
  audioEl.setAttribute('controlsList','nodownload noplaybackrate');
  // same track resume vs new
  if(audioEl.src && !audioEl.src.endsWith(url) && audioEl.getAttribute('src') !== url){
    audioEl.src = url;
  } else if(!audioEl.getAttribute('src') || audioEl.getAttribute('src') !== url){
    audioEl.src = url;
  }
  if(spTitle) spTitle.textContent = title || 'در حال پخش';
  sitePlayer.classList.add('is-on');
  clearAllPlaying();
  _activeWrap = wrapEl || null;
  if(_activeWrap){
    _activeWrap.classList.add('is-playing');
    _activeWrap.classList.add('has-progress');
  }
  audioEl.play().catch(()=>{});
}

function stopInlinePlayer(){
  audioEl.pause();
  sitePlayer.classList.remove('is-on');
  clearAllPlaying();
  _activeWrap = null;
}

audioEl.addEventListener('timeupdate', ()=>{
  if(!_activeWrap) return;
  const d = audioEl.duration;
  const c = audioEl.currentTime;
  if(d > 0) setRingProgress(_activeWrap, c / d);
  const timeEl = _activeWrap.querySelector('[data-time]');
  if(timeEl){
    timeEl.textContent = fmtTime(c) + ' / ' + fmtTime(d);
  }
  const sub = document.querySelector('.site-player__sub');
  if(sub) sub.textContent = fmtTime(c) + ' از ' + fmtTime(d);
});

audioEl.addEventListener('ended', ()=>{
  if(_activeWrap){
    setRingProgress(_activeWrap, 1);
    const timeEl = _activeWrap.querySelector('[data-time]');
    if(timeEl && audioEl.duration) timeEl.textContent = fmtTime(audioEl.duration) + ' / ' + fmtTime(audioEl.duration);
  }
  clearAllPlaying();
  sitePlayer.classList.remove('is-on');
  _activeWrap = null;
});

audioEl.addEventListener('loadedmetadata', ()=>{
  if(!_activeWrap) return;
  const timeEl = _activeWrap.querySelector('[data-time]');
  if(timeEl) timeEl.textContent = fmtTime(0) + ' / ' + fmtTime(audioEl.duration);
});


async function renderLibraryList(key){
  const category = CAT[key];
  const items = await fetchLibrary(category);
  if(!items.length){
    return `<div class="lib-empty">هنوز موردی ثبت نشده است.<br>از پنل ادمین → کتابخانه سایت اضافه کنید.</div>`;
  }
  return `<div class="circles">${items.map(it=>{
    const img = it.imageUrl || CAT_HERO[key];
    const isVideo = key === 'videos';
    const voiceOnly = !isVideo && !!it.isVoiceOnly;
    const href = isVideo ? `#/english/videos/${it.id}` : ((!voiceOnly) ? `#/english/${key}/${it.id}` : 'javascript:void(0)');
    const voice = (voiceOnly && it.audioUrl) ? it.audioUrl : '';
    const videoUrl = (isVideo && it.videoUrl) ? it.videoUrl : '';
    const isVoice = voiceOnly && voice;
    return `<a class="circle-wrap" href="${href}" data-id="${it.id}"
      data-audio="${voice}" data-video="${videoUrl}" data-title="${escapeHtml(it.title)}"
      data-voice-only="${isVoice ? '1' : '0'}"
      title="${escapeHtml(it.title)}">
      <span class="circle-stage">
        <svg class="circle-ring" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="ring-bg" cx="50" cy="50" r="46"></circle>
          <circle class="ring-fg" cx="50" cy="50" r="46"></circle>
        </svg>
        <span class="circle circle--sm">
          <img src="${img}" alt="${escapeHtml(it.title)}" loading="lazy">
          <span class="circle__label">${escapeHtml(it.title)}</span>
        </span>
      </span>
      <span class="circle-time" data-time>۰:۰۰</span>
    </a>`;
  }).join('')}</div>`;
}

async function renderDetail(key, id){
  try{
    const r = await fetch('/api/site/library/' + id);
    if(!r.ok) return `<div class="lib-empty">یافت نشد.</div>`;
    const it = await r.json();
    const img = it.imageUrl || CAT_HERO[key];
    const player = it.audioUrl
      ? `<div class="detail__player">
           <audio controls controlsList="nodownload noplaybackrate" oncontextmenu="return false" src="${it.audioUrl}"></audio>
         </div>`

      ? `<div class="detail__body-card"><div class="detail__body">${escapeHtml(it.bodyText)}</div></div>`
      : '';
    return `
      <div class="detail">
        <div class="detail__hero"><img src="${img}" alt="${escapeHtml(it.title)}"></div>
        <h1 class="detail__title">${escapeHtml(it.title)}</h1>

        </div>
      </div>`;

function escapeHtml(s){ return String(s).replace(/[&<>"']/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])); }


function stopVideoPreviews(){
  document.querySelectorAll('video.circle-preview').forEach(v=>{
    try{ v.pause(); v.remove(); }catch(_){}
  });
}

function bindVideoHoverPreviews(root){
  root.querySelectorAll('a.circle-wrap[data-video]').forEach(el=>{
    const url = (el.getAttribute('data-video') || '').trim();
    if(!url) return;
    let timer = null, stopTimer = null, touchTimer = null;
    const stage = el.querySelector('.circle-stage') || el;

    const startPreview = ()=>{
      stopVideoPreviews();
      const v = document.createElement('video');
      v.className = 'circle-preview';
      v.src = url;
      v.muted = true;
      v.playsInline = true;
      v.setAttribute('playsinline','');
      v.preload = 'auto';
      stage.appendChild(v);
      v.play().catch(()=>{});
      stopTimer = setTimeout(()=>{ try{ v.pause(); v.remove(); }catch(_){} }, 10000);
    };

    el.addEventListener('mouseenter', ()=>{
      clearTimeout(timer);
      timer = setTimeout(startPreview, 2000);
    });
    el.addEventListener('mouseleave', ()=>{
      clearTimeout(timer); clearTimeout(stopTimer); stopVideoPreviews();
    });
    el.addEventListener('touchstart', ()=>{
      touchTimer = setTimeout(startPreview, 2000);
    }, {passive:true});
    el.addEventListener('touchend', ()=>{ clearTimeout(touchTimer); });
    el.addEventListener('touchcancel', ()=>{ clearTimeout(touchTimer); });

    // explicit click navigation (hash)
    el.addEventListener('click', (e)=>{
      const id = el.getAttribute('data-id');
      if(!id) return;
      // allow normal hash navigation; ensure hash is set
      const target = '#/english/videos/' + id;
      if(location.hash !== target){
        e.preventDefault();
        location.hash = target;
      }
    });
  });
}

async function renderVideoWatch(id){
  try{
    const r = await fetch('/api/site/library/' + encodeURIComponent(id));
    if(!r.ok) return `<div class="lib-empty">یافت نشد. (کد ${r.status})</div>`;
    const it = await r.json();
    const img = it.imageUrl || CAT_HERO.videos || '';
    const videoUrl = it.videoUrl || '';
    const video = videoUrl
      ? `<div class="video-watch__player"><video id="vw-player" controls playsinline controlsList="nodownload" src="${videoUrl}" poster="${img}"></video></div>`
      : `<div class="lib-empty">برای این مورد فایل ویدیو ثبت نشده است.</div>`;

    const sideItem = (x, badge)=>{
      if(!x) return '';
      const thumb = x.imageUrl || img;
      const vurl = x.videoUrl || '';
      return `<div class="video-watch__item" data-play-id="${x.id}" data-play-url="${vurl}" data-play-title="${escapeHtml(x.title||'')}">
        <img src="${thumb}" alt="">
        <span>${badge?`<small style="display:block;color:var(--muted);font-size:10px">${badge}</small>`:''}${escapeHtml(x.title||'')}</span>
      </div>`;
    };

    let side = '';
    if(it.previous) side += `<div class="video-watch__group"><div class="video-watch__group-label">قبلی</div>${sideItem(it.previous,'قبلی')}</div>`;
    if(it.next) side += `<div class="video-watch__group"><div class="video-watch__group-label">بعدی</div>${sideItem(it.next,'بعدی')}</div>`;
    if(it.related && it.related.length)
      side += `<div class="video-watch__group"><div class="video-watch__group-label">مرتبط / پیشنهادی</div>${it.related.map(x=>sideItem(x,'')).join('')}</div>`;
    if(!side) side = `<p style="font-size:12.5px;color:var(--muted);margin:0">مورد مرتبطی تعریف نشده.</p>`;

    return `
      <div class="video-watch">
        <div>
          ${video}
          <h1 class="video-watch__title">${escapeHtml(it.title||'')}</h1>
          ${it.summary?`<p class="video-watch__sum">${escapeHtml(it.summary)}</p>`:''}
          ${it.bodyText?`<div class="detail__body-card"><div class="detail__body">${escapeHtml(it.bodyText)}</div></div>`:''}
        </div>
        <aside class="video-watch__side">
          <h3>مسیر یادگیری</h3>
          ${side}
        </aside>
      </div>
      <div style="text-align:center"><a class="back" href="#/english/videos">← فیلم‌های آموزشی</a></div>`;
  }catch(err){
    console.error(err);
    return `<div class="lib-empty">خطا در بارگذاری ویدیو.</div>`;
  }
}

function bindVideoWatchClicks(root){
  root.querySelectorAll('[data-play-id]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id = el.getAttribute('data-play-id');
      const url = el.getAttribute('data-play-url');
      const player = document.getElementById('vw-player');
      if(url && player){
        player.src = url;
        player.play().catch(()=>{});
        root.querySelectorAll('.video-watch__item').forEach(x=>x.classList.remove('is-on'));
        el.classList.add('is-on');
        history.replaceState(null,'', '#/english/videos/' + id);
        try{
          const r = await fetch('/api/site/library/' + id);
          if(r.ok){
            const it = await r.json();
            const title = root.querySelector('.video-watch__title');
            const sum = root.querySelector('.video-watch__sum');
            if(title) title.textContent = it.title || '';
            if(sum) sum.textContent = it.summary || '';
            if(it.imageUrl) player.poster = it.imageUrl;
          }
        }catch(_){}
      } else if(id){
        location.hash = '#/english/videos/' + id;
      }
    });
  });
}


async function route(){
  stopCarousel();
  stopInlinePlayer();
  const hash = location.hash || '#/';
  const parts = hash.replace(/^#\/?/,'').split('/').filter(Boolean);

  /* home */
  if(parts.length===0){
    const page = await fetchPage('home');
    const slides = slotsToCarousel(page) || CAROUSEL;
    const circles = slotsToCircles(page, HOME_CIRCLES);
    // inject dynamic carousel data
    window.__CAROUSEL = slides;
    app.innerHTML = `
      ${renderCarousel(slides)}
      <div class="main">
        ${circlesHtml(circles)}
      </div>`;
    return;
  }

  /* english hub */
  if(parts[0]==='english' && parts.length===1){
    const page = await fetchPage('english');
    const heroImg = (page && page.hero && page.hero.imageUrl) || IMG.lang;
    const circles = slotsToCircles(page, ENGLISH_CIRCLES);
    app.innerHTML = `
      <div class="hero-still"><img src="${heroImg}" alt="زبان انگلیسی"></div>
      <div class="main">
        <div class="sec-title"><h1>${(page&&page.hero&&page.hero.title)||'زبان انگلیسی'}</h1><p>${(page&&page.hero&&page.hero.subtitle)||'مسیر خود را انتخاب کنید'}</p></div>
        ${circlesHtml(circles)}
        <div style="text-align:center"><a class="back" href="#/">← صفحه اصلی</a></div>
      </div>`;
    return;
  }

  /* english library section or detail */
  if(parts[0]==='english' && ['podcast','stories','musics','books','videos'].includes(parts[1])){
    const key = parts[1];
    if(parts[2]){
      if(key === 'videos'){
        app.innerHTML = `<div class="main">${await renderVideoWatch(parts[2])}</div>`;
        bindVideoWatchClicks(app);
      } else {
        app.innerHTML = `<div class="main">${await renderDetail(key, parts[2])}</div>`;
      }
      return;
    }
    const page = await fetchPage('english-' + key);
    const heroImg = (page && page.hero && page.hero.imageUrl) || CAT_HERO[key];
    const title = (page && page.hero && page.hero.title) || CAT_NAME[key];
    app.innerHTML = `
      <div class="hero-still"><img src="${heroImg}" alt="${title}"></div>
      <div class="main">
        <div class="sec-title"><h1>${title}</h1></div>
        ${await renderLibraryList(key)}
        <div style="text-align:center"><a class="back" href="#/english">← زبان انگلیسی</a></div>
      </div>`;
    /* voice-only podcast: play inline — stay on page, show ring progress */
    app.querySelectorAll('a.circle-wrap[data-voice-only="1"]').forEach(el=>{
      const url = el.getAttribute('data-audio');
      if(!url) return;
      el.addEventListener('click', e=>{
        e.preventDefault();
        e.stopPropagation();
        playAudio(url, el.getAttribute('data-title') || '', el);
      });
    });
    /* educational videos: hover 2s → 10s preview in circle */
    if(key === 'videos'){
      bindVideoHoverPreviews(app);
    }
    return;
  }

  /* other skills — placeholder same structure */
  if(['painting','computer','music-skill'].includes(parts[0])){
    const map = {
      painting:{title:'نقاشی', img:IMG.paint},
      computer:{title:'کامپیوتر', img:IMG.code},
      'music-skill':{title:'موسیقی', img:IMG.music}
    };
    const m = map[parts[0]];
    app.innerHTML = `
      <div class="hero-still"><img src="${m.img}" alt="${m.title}"></div>
      <div class="main">
        <div class="sec-title"><h1>${m.title}</h1><p>به‌زودی</p></div>
        <div style="text-align:center"><a class="back" href="#/">← صفحه اصلی</a></div>
      </div>`;
    return;
  }

  location.hash = '#/';
}

window.addEventListener('hashchange', route);
route();
