<script>

  /* دایره‌های صفحه اصلی */

  story:  '/site/img/circle-stories.svg',
  concert:'/site/img/circle-musics.svg',
  oxford: '/site/img/circle-books.svg',
};

const CAROUSEL = [
  { img: IMG.lang,  title: 'زبان انگلیسی', sub: 'مسیر یادگیری از پایه تا پیشرفته' },
  { img: IMG.paint, title: 'نقاشی',        sub: 'خلاقیت روی بوم' },
  { img: IMG.music, title: 'موسیقی',       sub: 'ریتم، ساز و اجرا' },
  { img: IMG.code,  title: 'کامپیوتر',     sub: 'کد، ابزار و مهارت دیجیتال' },
];

const HOME_CIRCLES = [
  { id:'english',  label:'زبان انگلیسی', img: IMG.book,   route:'#/english' },
  { id:'painting', label:'نقاشی',         img: IMG.artist, route:'#/painting' },
  { id:'computer', label:'کامپیوتر',      img: IMG.coder,  route:'#/computer' },
  { id:'music',    label:'موسیقی',        img: IMG.guitar, route:'#/music-skill' },
];

const ENGLISH_CIRCLES = [
  { id:'podcast', label:'پادکست',  img: IMG.headph,  route:'#/english/podcast' },
  { id:'videos',  label:'فیلم‌ها',   img: IMG.code,    route:'#/english/videos' },
  { id:'stories', label:'داستان',  img: IMG.story,   route:'#/english/stories' },
  { id:'musics',  label:'موسیقی',  img: IMG.concert, route:'#/english/musics' },
  { id:'books',   label:'کتاب',    img: IMG.oxford,  route:'#/english/books' },
];


async function fetchPage(pageKey){
  try{
    const r = await fetch('/api/site/pages/' + encodeURIComponent(pageKey));
    if(!r.ok) return null;
    return await r.json();
  }catch{ return null; }
}

function slotsToCarousel(page){
  if(!page || !page.carousel || !page.carousel.length) return null;
  return page.carousel.map(s => ({
    img: s.imageUrl || IMG.lang,
    title: s.title || '',
    sub: s.subtitle || ''
  }));
}

function inferCircleRoute(title, fallback, index){
  const t = (title || '').trim();
  const rules = [
    [/پادکست|podcast/i, '#/english/podcast'],
    [/فیلم|video/i, '#/english/videos'],
    [/داستان|stor/i, '#/english/stories'],
    [/کتاب|book/i, '#/english/books'],
    [/انگلیس|english/i, '#/english'],
    [/نقاش|paint|art/i, '#/painting'],
    [/کامپیوتر|computer|code/i, '#/computer'],
    [/موسیقی.*انگلیس|musics/i, '#/english/musics'],
    [/موسیقی|music/i, '#/music-skill'],
  ];
  for(const [re, route] of rules){
    if(re.test(t)) return route;
  }
  if(fallback && fallback[index] && fallback[index].route) return fallback[index].route;
  return null;
}

function slotsToCircles(page, fallback){
  if(!page || !page.circles || !page.circles.length) return fallback;
  return page.circles.map((s, i) => {
    let route = (s.linkHref || '').trim();
    if(!route || route === '#' || route === '#/'){
      route = inferCircleRoute(s.title, fallback, i) || (fallback[i] && fallback[i].route) || '#/';
    }
    const fb = fallback && fallback[i];
    return {
      id: String(s.id),
      label: s.title || (fb && fb.label) || '',
      img: s.imageUrl || (fb && fb.img) || IMG.book,
      route
    };
  });
}

const CAT = { podcast:1, stories:2, musics:3, books:4, videos:5 };
const CAT_NAME = { podcast:'پادکست', stories:'داستان', musics:'موسیقی', books:'کتاب', videos:'فیلم‌های آموزشی' };
const CAT_HERO = { podcast:IMG.headph, stories:IMG.story, musics:IMG.concert, books:IMG.oxford, videos:IMG.code };

const app = document.getElementById('app');
const audioEl = document.getElementById('audio-el');
let carouselTimer = null;

function stopCarousel(){ if(carouselTimer){ clearInterval(carouselTimer); carouselTimer=null; } }

function renderCarousel(slides){
  const data = (slides && slides.length) ? slides : CAROUSEL;
  let i = 0;
  const html = `
  <div class="carousel" id="carousel">
    <div class="carousel__track" id="c-track">
      ${data.map(s=>`
        <div class="carousel__slide">
          <img src="${s.img}" alt="${s.title||''}" loading="eager"
               onerror="this.style.opacity='.3'" draggable="false">
          <div class="carousel__caption"><div>
            <h2>${s.title||''}</h2>
            ${s.sub?`<p>${s.sub}</p>`:''}
          </div></div>
        </div>`).join('')}
    </div>
    <button type="button" class="carousel__arrow carousel__arrow--prev" id="c-prev" aria-label="قبلی">‹</button>
    <button type="button" class="carousel__arrow carousel__arrow--next" id="c-next" aria-label="بعدی">›</button>
    <div class="carousel__dots" id="c-dots">
      ${data.map((_,d)=>`<button type="button" data-i="${d}" class="${d===0?'is-on':''}" aria-label="slide ${d+1}"></button>`).join('')}
    </div>
  </div>`;
  requestAnimationFrame(()=>{
    const root = document.getElementById('carousel');
    const track = document.getElementById('c-track');
    const dots = document.getElementById('c-dots');
    if(!track||!dots||!root) return;

    const go = (n)=>{
      i = ((n % data.length) + data.length) % data.length;
      track.style.transition = 'transform .35s ease';
      track.style.transform = 'translate3d(' + (-i * 100) + '%,0,0)';
      dots.querySelectorAll('button').forEach((b,bi)=>b.classList.toggle('is-on', bi===i));
    };

    const start = ()=>{
      stopCarousel();
      if(data.length > 1){
        carouselTimer = setInterval(()=>go(i+1), 4800);
      }
    };

    go(0);
    dots.querySelectorAll('button').forEach(b=>{
      b.addEventListener('click', ()=>{ stopCarousel(); go(+b.dataset.i); start(); });
    });
    document.getElementById('c-prev')?.addEventListener('click', ()=>{ stopCarousel(); go(i-1); start(); });
    document.getElementById('c-next')?.addEventListener('click', ()=>{ stopCarousel(); go(i+1); start(); });

    /* —— touch / pointer swipe (mobile + desktop drag) —— */
    let startX = 0, startY = 0, deltaX = 0, dragging = false, axis = null;
    const threshold = 40; // px

    const onDown = (clientX, clientY)=>{
      if(data.length < 2) return;
      dragging = true;
      axis = null;
      startX = clientX;
      startY = clientY;
      deltaX = 0;
      stopCarousel();
      track.classList.add('is-dragging');
      track.style.transition = 'none';
    };
    const onMove = (clientX, clientY)=>{
      if(!dragging) return;
      const dx = clientX - startX;
      const dy = clientY - startY;
      if(axis === null){
        if(Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
        axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
        if(axis === 'y'){ dragging = false; track.classList.remove('is-dragging'); return; }
      }
      if(axis !== 'x') return;
      deltaX = dx;
      const pct = (deltaX / root.offsetWidth) * 100;
      track.style.transform = 'translate3d(' + ((-i * 100) + pct) + '%,0,0)';
    };
    const onUp = ()=>{
      if(!dragging && axis !== 'x'){ track.classList.remove('is-dragging'); return; }
      track.classList.remove('is-dragging');
      dragging = false;
      if(Math.abs(deltaX) > threshold){
        go(deltaX < 0 ? i + 1 : i - 1);
      } else {
        go(i);
      }
      deltaX = 0;
      axis = null;
      start();
    };

    // Pointer events (covers touch + mouse)
    root.addEventListener('pointerdown', e=>{
      if(e.button !== undefined && e.button !== 0) return;
      if(e.target.closest('.carousel__arrow, .carousel__dots')) return;
      onDown(e.clientX, e.clientY);
      try{ root.setPointerCapture(e.pointerId); }catch(_){}
    });
    root.addEventListener('pointermove', e=>{
      if(!dragging) return;
      onMove(e.clientX, e.clientY);
    });
    root.addEventListener('pointerup', onUp);
    root.addEventListener('pointercancel', onUp);
    root.addEventListener('pointerleave', e=>{
      if(dragging) onUp();
    });

    // Fallback touch for older browsers
    root.addEventListener('touchstart', e=>{
      if(!e.touches[0]) return;
      if(e.target.closest('.carousel__arrow, .carousel__dots')) return;
      onDown(e.touches[0].clientX, e.touches[0].clientY);
    }, {passive:true});
    root.addEventListener('touchmove', e=>{
      if(!dragging || axis !== 'x' || !e.touches[0]) return;
      onMove(e.touches[0].clientX, e.touches[0].clientY);
      if(axis === 'x') e.preventDefault();
    }, {passive:false});
    root.addEventListener('touchend', onUp);
    root.addEventListener('touchcancel', onUp);

    start();
  });
  return html;
}

function circlesHtml(items, sm=false){
  return `<div class="circles">${items.map(c=>`
    <a class="circle ${sm?'circle--sm':''}" href="${c.route}" data-route="${c.route}">
      <img src="${c.img}" alt="${c.label}" loading="lazy">
      <span class="circle__label">${c.label}</span>
    </a>`).join('')}</div>`;
}

async function fetchLibrary(category){
  try{
    const r = await fetch(`/api/site/library?category=${category}`);
    if(!r.ok) return [];
    return await r.json();
  }catch{ return []; }
}

const sitePlayer = document.getElementById('site-player');
const spTitle = document.getElementById('sp-title');
const CIRC = 2 * Math.PI * 46; // r=46

function fmtTime(sec){
  if(!isFinite(sec) || sec < 0) return '۰:۰۰';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  const raw = m + ':' + String(s).padStart(2,'0');
  return raw.replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
}

function setRingProgress(wrap, ratio){
  if(!wrap) return;
  const fg = wrap.querySelector('.ring-fg');
  if(!fg) return;
  const r = Math.max(0, Math.min(1, ratio || 0));
  fg.style.strokeDasharray = String(CIRC);
  fg.style.strokeDashoffset = String(CIRC * (1 - r));
}

function clearAllPlaying(){
  document.querySelectorAll('.circle-wrap.is-playing, .circle.is-playing').forEach(el=>{
    el.classList.remove('is-playing');
  });
}

document.getElementById('sp-close')?.addEventListener('click', ()=>{
  stopInlinePlayer();
});

let _activeWrap = null;

function playAudio(url, title, wrapEl){
  if(!url) return;
  audioEl.setAttribute('controlsList','nodownload noplaybackrate');
  // same track resume vs new
  if(audioEl.src && !audioEl.src.endsWith(url) && audioEl.getAttribute('src') !== url){
    audioEl.src = url;
  } else if(!audioEl.getAttribute('src') || audioEl.getAttribute('src') !== url){
    audioEl.src = url;
  }
  if(spTitle) spTitle.textContent = title || 'در حال پخش';
  sitePlayer.classList.add('is-on');
  clearAllPlaying();
  _activeWrap = wrapEl || null;
  if(_activeWrap){
    _activeWrap.classList.add('is-playing');
    _activeWrap.classList.add('has-progress');
  }
  audioEl.play().catch(()=>{});
}

function stopInlinePlayer(){
  audioEl.pause();
  sitePlayer.classList.remove('is-on');
  clearAllPlaying();
  _activeWrap = null;
}

audioEl.addEventListener('timeupdate', ()=>{
  if(!_activeWrap) return;
  const d = audioEl.duration;
  const c = audioEl.currentTime;
  if(d > 0) setRingProgress(_activeWrap, c / d);
  const timeEl = _activeWrap.querySelector('[data-time]');
  if(timeEl){
    timeEl.textContent = fmtTime(c) + ' / ' + fmtTime(d);
  }
  const sub = document.querySelector('.site-player__sub');
  if(sub) sub.textContent = fmtTime(c) + ' از ' + fmtTime(d);
});

audioEl.addEventListener('ended', ()=>{
  if(_activeWrap){
    setRingProgress(_activeWrap, 1);
    const timeEl = _activeWrap.querySelector('[data-time]');
    if(timeEl && audioEl.duration) timeEl.textContent = fmtTime(audioEl.duration) + ' / ' + fmtTime(audioEl.duration);
  }
  clearAllPlaying();
  sitePlayer.classList.remove('is-on');
  _activeWrap = null;
});

audioEl.addEventListener('loadedmetadata', ()=>{
  if(!_activeWrap) return;
  const timeEl = _activeWrap.querySelector('[data-time]');
  if(timeEl) timeEl.textContent = fmtTime(0) + ' / ' + fmtTime(audioEl.duration);
});


async function renderLibraryList(key){
  const category = CAT[key];
  const items = await fetchLibrary(category);
  if(!items.length){
    return `<div class="lib-empty">هنوز موردی ثبت نشده است.<br>از پنل ادمین → کتابخانه سایت اضافه کنید.</div>`;
  }
  return `<div class="circles">${items.map(it=>{
    const img = it.imageUrl || CAT_HERO[key];
    const isVideo = key === 'videos';
    const voiceOnly = !isVideo && !!it.isVoiceOnly;
    const href = isVideo ? `#/english/videos/${it.id}` : ((!voiceOnly) ? `#/english/${key}/${it.id}` : 'javascript:void(0)');
    const voice = (voiceOnly && it.audioUrl) ? it.audioUrl : '';
    const videoUrl = (isVideo && it.videoUrl) ? it.videoUrl : '';
    const isVoice = voiceOnly && voice;
    return `<a class="circle-wrap" href="${href}" data-id="${it.id}"
      data-audio="${voice}" data-video="${videoUrl}" data-title="${escapeHtml(it.title)}"
      data-voice-only="${isVoice ? '1' : '0'}"
      title="${escapeHtml(it.title)}">
      <span class="circle-stage">
        <svg class="circle-ring" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="ring-bg" cx="50" cy="50" r="46"></circle>
          <circle class="ring-fg" cx="50" cy="50" r="46"></circle>
        </svg>
        <span class="circle circle--sm">
          <img src="${img}" alt="${escapeHtml(it.title)}" loading="lazy">
          <span class="circle__label">${escapeHtml(it.title)}</span>
        </span>
      </span>
      <span class="circle-time" data-time>۰:۰۰</span>
    </a>`;
  }).join('')}</div>`;
}

async function renderDetail(key, id){
  try{
    const r = await fetch('/api/site/library/' + id);
    if(!r.ok) return `<div class="lib-empty">یافت نشد.</div>`;
    const it = await r.json();
    const img = it.imageUrl || CAT_HERO[key];
    const player = it.audioUrl
      ? `<div class="detail__player">
           <audio controls controlsList="nodownload noplaybackrate" oncontextmenu="return false" src="${it.audioUrl}"></audio>
         </div>`
      : '';
    const body = (it.bodyText && String(it.bodyText).trim())
      ? `<div class="detail__body-card"><div class="detail__body">${escapeHtml(it.bodyText)}</div></div>`
      : '';
    return `
      <div class="detail">
        <div class="detail__hero"><img src="${img}" alt="${escapeHtml(it.title)}"></div>
        <h1 class="detail__title">${escapeHtml(it.title)}</h1>
        ${it.summary ? `<p class="detail__summary">${escapeHtml(it.summary)}</p>` : ''}
        ${player}
        ${body}
        <div style="text-align:center;margin-top:20px">
          <a class="back" href="#/english/${key}">← بازگشت به ${CAT_NAME[key]||'لیست'}</a>
        </div>
      </div>`;
  }catch{
    return `<div class="lib-empty">خطا در بارگذاری.</div>`;
  }
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])); }


function stopVideoPreviews(){
  document.querySelectorAll('video.circle-preview').forEach(v=>{
    try{ v.pause(); v.remove(); }catch(_){}
  });
}

function bindVideoHoverPreviews(root){
  root.querySelectorAll('a.circle-wrap[data-video]').forEach(el=>{
    const url = (el.getAttribute('data-video') || '').trim();
    if(!url) return;
    let timer = null, stopTimer = null, touchTimer = null;
    const stage = el.querySelector('.circle-stage') || el;

    const startPreview = ()=>{
      stopVideoPreviews();
      const v = document.createElement('video');
      v.className = 'circle-preview';
      v.src = url;
      v.muted = true;
      v.playsInline = true;
      v.setAttribute('playsinline','');
      v.preload = 'auto';
      stage.appendChild(v);
      v.play().catch(()=>{});
      stopTimer = setTimeout(()=>{ try{ v.pause(); v.remove(); }catch(_){} }, 10000);
    };

    el.addEventListener('mouseenter', ()=>{
      clearTimeout(timer);
      timer = setTimeout(startPreview, 2000);
    });
    el.addEventListener('mouseleave', ()=>{
      clearTimeout(timer); clearTimeout(stopTimer); stopVideoPreviews();
    });
    el.addEventListener('touchstart', ()=>{
      touchTimer = setTimeout(startPreview, 2000);
    }, {passive:true});
    el.addEventListener('touchend', ()=>{ clearTimeout(touchTimer); });
    el.addEventListener('touchcancel', ()=>{ clearTimeout(touchTimer); });

    // explicit click navigation (hash)
    el.addEventListener('click', (e)=>{
      const id = el.getAttribute('data-id');
      if(!id) return;
      // allow normal hash navigation; ensure hash is set
      const target = '#/english/videos/' + id;
      if(location.hash !== target){
        e.preventDefault();
        location.hash = target;
      }
    });
  });
}

async function renderVideoWatch(id){
  try{
    const r = await fetch('/api/site/library/' + encodeURIComponent(id));
    if(!r.ok) return `<div class="lib-empty">یافت نشد. (کد ${r.status})</div>`;
    const it = await r.json();
    return buildVideoWatchHtml(it);
  }catch(err){
    console.error(err);
    return `<div class="lib-empty">خطا در بارگذاری ویدیو.</div>`;
  }
}

function sideItemHtml(x, badge, imgFallback){
  if(!x) return '';
  const thumb = x.imageUrl || imgFallback || '';
  const vurl = x.videoUrl || '';
  return `<div class="video-watch__item" data-play-id="${x.id}" data-play-url="${vurl}" data-play-title="${escapeHtml(x.title||'')}">
    <img src="${thumb}" alt="">
    <span>${badge?`<small style="display:block;color:var(--muted);font-size:10px">${badge}</small>`:''}${escapeHtml(x.title||'')}</span>
  </div>`;
}

async function fetchLibraryPage(category, skip, take, excludeId){
  const qs = new URLSearchParams();
  if(category != null) qs.set('category', category);
  qs.set('skip', String(skip||0));
  qs.set('take', String(take||10));
  if(excludeId) qs.set('excludeId', String(excludeId));
  try{
    const r = await fetch('/api/site/library?' + qs.toString());
    if(!r.ok) return { items:[], total:0, hasMore:false };
    const data = await r.json();
    // paginated shape or plain array (legacy)
    if(Array.isArray(data)) return { items:data, total:data.length, hasMore:false };
    return {
      items: data.items || data.Items || [],
      total: data.total ?? data.Total ?? 0,
      hasMore: !!(data.hasMore ?? data.HasMore)
    };
  }catch{ return { items:[], total:0, hasMore:false }; }
}

/** Build sidebar: prev/next + related/suggested in pages of 10, or all-videos infinite if both empty */
async function buildVideoSideHtml(it){
  const img = it.imageUrl || CAT_HERO.videos || '';
  let side = '';
  if(it.previous) side += `<div class="video-watch__group"><div class="video-watch__group-label">قبلی</div>${sideItemHtml(it.previous,'قبلی',img)}</div>`;
  if(it.next) side += `<div class="video-watch__group"><div class="video-watch__group-label">بعدی</div>${sideItemHtml(it.next,'بعدی',img)}</div>`;

  const related = it.related || [];
  const suggested = it.suggested || [];

  if(related.length){
    const first = related.slice(0, 10);
    side += `<div class="video-watch__group" data-list="related" data-ids="${related.map(x=>x.id).join(',')}" data-offset="10">
      <div class="video-watch__group-label">مرتبط</div>
      <div class="video-watch__list">${first.map(x=>sideItemHtml(x,'',img)).join('')}</div>
      ${related.length > 10 ? '<div class="video-watch__more" data-more="related">در حال بارگذاری…</div>' : ''}
    </div>`;
  }
  if(suggested.length){
    const first = suggested.slice(0, 10);
    side += `<div class="video-watch__group" data-list="suggested" data-ids="${suggested.map(x=>x.id).join(',')}" data-offset="10">
      <div class="video-watch__group-label">پیشنهادی</div>
      <div class="video-watch__list">${first.map(x=>sideItemHtml(x,'',img)).join('')}</div>
      ${suggested.length > 10 ? '<div class="video-watch__more" data-more="suggested">در حال بارگذاری…</div>' : ''}
    </div>`;
  }

  // neither related nor suggested → all videos, 10 at a time
  if(!related.length && !suggested.length){
    const page = await fetchLibraryPage(CAT.videos, 0, 10, it.id);
    side += `<div class="video-watch__group" data-list="all" data-skip="10" data-exclude="${it.id}" data-hasmore="${page.hasMore ? '1':'0'}">
      <div class="video-watch__group-label">همه فیلم‌ها</div>
      <div class="video-watch__list">${(page.items||[]).map(x=>sideItemHtml(x,'',img)).join('')}</div>
      <div class="video-watch__more" data-more="all" style="${page.hasMore?'':'display:none'}">اسکرول برای موارد بیشتر…</div>
    </div>`;
  }
  if(!side) side = `<p style="font-size:12.5px;color:var(--muted);margin:0">فیلم دیگری نیست.</p>`;
  return side;
}

function bindVideoSideInfinite(root){
  const side = root.querySelector('#vw-side') || root.querySelector('.video-watch__side');
  if(!side || side._infBound) return;
  side._infBound = true;
  let loading = false;
  side.addEventListener('scroll', async ()=>{
    if(loading) return;
    if(side.scrollTop + side.clientHeight < side.scrollHeight - 40) return;
    const group = side.querySelector('.video-watch__group[data-list]');
    if(!group) return;
    const listType = group.getAttribute('data-list');
    const listEl = group.querySelector('.video-watch__list');
    const moreEl = group.querySelector('.video-watch__more');
    if(!listEl) return;
    loading = true;
    try{
      if(listType === 'all'){
        if(group.getAttribute('data-hasmore') !== '1') return;
        const skip = parseInt(group.getAttribute('data-skip')||'0',10);
        const exclude = group.getAttribute('data-exclude');
        const page = await fetchLibraryPage(CAT.videos, skip, 10, exclude);
        const img = CAT_HERO.videos || '';
        listEl.insertAdjacentHTML('beforeend', (page.items||[]).map(x=>sideItemHtml(x,'',img)).join(''));
        group.setAttribute('data-skip', String(skip + (page.items||[]).length));
        group.setAttribute('data-hasmore', page.hasMore ? '1' : '0');
        if(moreEl) moreEl.style.display = page.hasMore ? '' : 'none';
        wirePlayClicks(root);
      } else if(listType === 'related' || listType === 'suggested'){
        const ids = (group.getAttribute('data-ids')||'').split(',').filter(Boolean);
        let offset = parseInt(group.getAttribute('data-offset')||'0',10);
        if(offset >= ids.length){ if(moreEl) moreEl.style.display='none'; return; }
        const slice = ids.slice(offset, offset+10);
        const img = CAT_HERO.videos || '';
        for(const id of slice){
          try{
            const r = await fetch('/api/site/library/' + id);
            if(r.ok){
              const it = await r.json();
              listEl.insertAdjacentHTML('beforeend', sideItemHtml(it,'',img));
            }
          }catch(_){}
        }
        offset += slice.length;
        group.setAttribute('data-offset', String(offset));
        if(moreEl) moreEl.style.display = offset >= ids.length ? 'none' : '';
        wirePlayClicks(root);
      }
    } finally { loading = false; }
  });
}

function wirePlayClicks(root){
  const player = () => document.getElementById('vw-player');
  const sideBody = () => document.getElementById('vw-side-body');
  root.querySelectorAll('[data-play-id]').forEach(el=>{
    if(el._wired) return;
    el._wired = true;
    el.addEventListener('click', async ()=>{
      const id = el.getAttribute('data-play-id');
      if(!id) return;
      try{
        const r = await fetch('/api/site/library/' + encodeURIComponent(id));
        if(!r.ok) return;
        const it = await r.json();
        const p = player();
        if(p && it.videoUrl){
          p.src = it.videoUrl;
          if(it.imageUrl) p.poster = it.imageUrl;
          p.play().catch(()=>{});
        }
        const title = root.querySelector('.video-watch__title');
        const sum = root.querySelector('.video-watch__sum');
        if(title) title.textContent = it.title || '';
        if(sum) sum.textContent = it.summary || '';
        history.replaceState(null,'', '#/english/videos/' + id);
        const sb = sideBody();
        if(sb){
          // reset infinite scroll binding
          const side = root.querySelector('#vw-side');
          if(side) side._infBound = false;
          sb.innerHTML = await buildVideoSideHtml(it);
          wirePlayClicks(root);
          bindVideoSideInfinite(root);
        }
        root.querySelectorAll('.video-watch__item').forEach(x=>x.classList.remove('is-on'));
        const active = root.querySelector(`[data-play-id="${id}"]`);
        if(active) active.classList.add('is-on');
      }catch(err){ console.error(err); }
    });
  });
}

function bindVideoWatchClicks(root){
  wirePlayClicks(root);
  bindVideoSideInfinite(root);
}

let _courseFilter = null;

async function fetchCourses(level, subject){
  const params = new URLSearchParams();
  if(level) params.set('level', level);
  if(subject) params.set('subject', subject);
  const q = params.toString() ? ('?' + params.toString()) : '';
  try{
    const res = await fetch('/api/site/courses' + q, { cache: 'no-store' });
    if(!res.ok){ console.warn('courses API', res.status); return []; }
    const data = await res.json();
    if(Array.isArray(data)) return data;
    if(data && Array.isArray(data.items)) return data.items;
    console.warn('courses unexpected payload', data);
    return [];
  }catch(ex){ console.warn('courses fetch', ex); return []; }
}

function formatToman(n){
  try{ return Number(n).toLocaleString('fa-IR') + ' تومان'; }catch(_){ return n + ' تومان'; }
}

function courseCardsHtml(list){
  if(!list || !list.length){
    return '<div class="course-empty">به‌زودی دوره‌ها از پنل ادمین اضافه می‌شوند.</div>';
  }
  return '<div class="course-grid">' + list.map(c => {
    const hasVideo = !!(c.videoUrl || c.VideoUrl);
    const img = c.imageUrl || c.ImageUrl || (c.imageContentId || c.ImageContentId ? ('/api/site/media/' + (c.imageContentId || c.ImageContentId)) : null) || '/site/img/circle-english.svg';
    const videoUrl = c.videoUrl || c.VideoUrl || '';
    const sessions = (c.sessionCount ?? c.SessionCount) ? ((c.sessionCount ?? c.SessionCount) + ' جلسه') : '';
    const durMin = c.sessionDurationMinutes ?? c.SessionDurationMinutes;
    const dur = durMin ? (' · ' + durMin + ' دقیقه') : '';
    const when = c.startsAtPersian || c.StartsAtPersian || '';
    const title = c.title || c.Title || '';
    const badge = c.levelLabel || c.LevelLabel || c.level || c.Level || '';
    const price = c.tuitionAmount ?? c.TuitionAmount ?? 0;
    const id = c.id ?? c.Id;
    const media = hasVideo
      ? `<div class="course-card__media" data-course-id="${id}">
           <img src="${img}" alt="${title}" id="course-poster-${id}" onerror="this.style.opacity=.3">

      : `<div class="course-card__media">
           <img src="${img}" alt="${title}" onerror="this.style.opacity=.3">
           <span class="course-card__badge">${badge}</span>
         </div>`;
    return `<article class="course-card">
      ${media}
      <div class="course-card__body">

function courseFiltersHtml(active){
  const levels = [null,'A1','A2','B1','B2','C1','C2','IELTS'];

function wireCourseCards(root){
  root.querySelectorAll('[data-course-filter]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const v = btn.getAttribute('data-course-filter') || null;
      _courseFilter = v || null;
      const list = await fetchCourses(_courseFilter, window.__courseSubject || 'English');
      const host = root.querySelector('#course-cards-host');
      if(host) host.innerHTML = courseCardsHtml(list);
      root.querySelectorAll('[data-course-filter]').forEach(b=>{
        const bv = b.getAttribute('data-course-filter') || null;
        b.classList.toggle('is-on', (bv||null) === (_courseFilter||null) || (!_courseFilter && !bv));
      });
      wireCoursePlay(root);
    });
  });
  wireCoursePlay(root);
}

function wireCoursePlay(root){
  root.querySelectorAll('[data-play-course]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.preventDefault();
      e.stopPropagation();
      const id = btn.getAttribute('data-play-course');
      const vid = document.getElementById('course-vid-' + id);
      const poster = document.getElementById('course-poster-' + id);
      if(!vid) return;
      // pause other
      if(_coursePlaying && _coursePlaying !== vid){
        try{ _coursePlaying.pause(); }catch(_){}
        const op = document.getElementById('course-poster-' + _coursePlaying.id.replace('course-vid-',''));
        if(op) op.style.display = '';
        _coursePlaying.style.display = 'none';
        const ob = document.querySelector('[data-play-course="'+_coursePlaying.id.replace('course-vid-','')+'"]');
        if(ob) ob.style.display = '';
      }
      if(poster) poster.style.display = 'none';
      vid.style.display = 'block';
      btn.style.display = 'none';
      vid.play().catch(()=>{});
      _coursePlaying = vid;
      vid.onended = ()=>{
        vid.style.display = 'none';
        if(poster) poster.style.display = '';
        btn.style.display = '';
        _coursePlaying = null;
      };
    });
  });
}

async function loadGameBankFromServer(){
  try{
    const res = await fetch('/api/placement/game-bank', {cache:'no-store'});
    if(!res.ok) return;
    const data = await res.json();
    if(data.grammar && data.grammar.length) PG_BANK.grammar = data.grammar;
    if(data.vocab && data.vocab.length) PG_BANK.vocab = data.vocab;
    if(data.listening && data.listening.length) PG_BANK.listening = data.listening;
    if(data.speaking && data.speaking.length) PG_BANK.speaking = data.speaking;
    if(PG_BANK.grammar) _pg && (_pg.max.grammar = PG_BANK.grammar.length);
    if(PG_BANK.vocab) _pg && (_pg.max.vocab = PG_BANK.vocab.length);
    if(PG_BANK.listening) _pg && (_pg.max.listening = PG_BANK.listening.length);
    if(PG_BANK.speaking) _pg && (_pg.max.speaking = PG_BANK.speaking.length);
  }catch(_){}
}

let _pg = null;

function pgNewState(candidateId){
  return {
    candidateId,
    done: { grammar:false, vocab:false, listening:false, speaking:false },
    scores: { grammar:0, vocab:0, listening:0, speaking:0 },
    max: { grammar:18, vocab:8, listening:3, speaking:7 },
    mode: 'hub',
    idx: 0,
    locked: false,
    vocabSlots: [],
    vocabPool: [],
    vocabUsed: []
  };
}

function pgScore10(got, max){
  if(max<=0) return 0;
  return Math.round((got / max) * 100) / 10;
}

function pgAllDone(){
  return _pg && _pg.done.grammar && _pg.done.vocab && _pg.done.listening && _pg.done.speaking;
}

function scramble(word){
  const a = word.split('');
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const t = a[i]; a[i]=a[j]; a[j]=t;
  }
  if(a.join('')===word && word.length>1) return scramble(word);
  return a;
}

function normalizeLyric(s){
  return (s||'').toLowerCase().replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ').trim();
}

async function pgFinishAndSubmit(){
  const listening = pgScore10(_pg.scores.listening, _pg.max.listening);
  const reading = pgScore10(_pg.scores.speaking, _pg.max.speaking);
  const writing = pgScore10(_pg.scores.grammar, _pg.max.grammar);
  const vocabulary = pgScore10(_pg.scores.vocab, _pg.max.vocab);
  const avg = (listening+reading+writing+vocabulary)/4;
  let level = 'A1';
  if(avg>=9) level='C2';
  else if(avg>=7.5) level='C1';
  else if(avg>=6) level='B2';
  else if(avg>=4.5) level='B1';
  else if(avg>=3) level='A2';

  try{
    await fetch('/api/placement/submit-game', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        candidateId: _pg.candidateId,
        listeningScore: listening,
        readingScore: reading,
        writingScore: writing,
        vocabularyScore: vocabulary,
        suggestionLevel: level
      })
    });
  }catch(_){}

  _pg.mode = 'result';
  _pg.result = { listening, reading, writing, vocabulary, avg, level };
  paintPlacementGame();
}

    </button>`;
  }).join('');
  const finished = keys.filter(k=>_pg.done[k]).length;
  return `<div class="pg">
    <h1 class="pg__title">بازی تعیین سطح</h1>
    <p class="pg__sub">یک مهارت را انتخاب کن · ${finished} از ۴ انجام شده</p>
    <div class="pg-cubes">${cubes}</div>
  </div>`;
}

function renderGrammarRound(){
  const list = PG_BANK.grammar;
  const item = list[_pg.idx];
  if(!item) return '';
  const opts = item.opts.map((o,i)=>
    `<button type="button" class="pg-opt" data-oi="${i}">${o}</button>`
  ).join('');
  return `<div class="pg">
    <div class="pg-hud"><span>گرامر · ${item.level}</span><b>${_pg.idx+1} / ${list.length}</b></div>
    <div class="pg-q"><p class="pg-q__text" dir="ltr">${item.q}</p><div class="pg-opts">${opts}</div></div>
  </div>`;
}

function renderVocabRound(){
  const list = PG_BANK.vocab;
  const item = list[_pg.idx];
  if(!item) return '';
  if(!_pg.vocabPool || !_pg.vocabPool.length){
    _pg.vocabPool = scramble(item.word);
    _pg.vocabSlots = Array(item.word.length).fill('');
    _pg.vocabUsed = _pg.vocabPool.map(()=>false);
  }
  const slots = _pg.vocabSlots.map((ch,i)=>
    `<button type="button" class="pg-slot${ch?' filled':''}" data-slot="${i}">${ch||''}</button>`
  ).join('');
  const letters = _pg.vocabPool.map((ch,i)=>
    `<button type="button" class="pg-letter${_pg.vocabUsed[i]?' used':''}" data-li="${i}" draggable="${_pg.vocabUsed[i]?'false':'true'}">${ch}</button>`
  ).join('');
  return `<div class="pg">
    <div class="pg-hud"><span>واژگان · ${item.level}</span><b>${_pg.idx+1} / ${list.length}</b></div>
    <div class="pg-q">
      <p class="pg-q__text">حروف را بچین تا کلمه ساخته شود</p>
      <div class="pg-vocab">
        <div class="pg-slots">${slots}</div>
        <div class="pg-letters">${letters}</div>
        <button type="button" class="pg-btn" id="pg-vocab-check">تأیید</button>
      </div>
    </div>
  </div>`;
}

function renderListeningRound(){

    <div class="pg-hud"><span>شنیداری</span><b>${_pg.idx+1} / ${list.length}</b></div>
    <div class="pg-q">
      <p class="pg-q__text">بیت اول را بخوان؛ بیت دوم را بشنو و همان را بنویس</p>
      <div class="pg-listen-line">${item.line1}</div>
      <button type="button" class="pg-btn pg-btn--ghost" id="pg-listen-play">▶ پخش بیت دوم (برای نوشتن)</button>
      <p style="margin:12px 0 6px;font-size:12px;color:var(--muted)">${item.hint||''}</p>
      <input class="pg-input" id="pg-listen-input" placeholder="Write what you hear..." autocomplete="off" />
      <div style="margin-top:12px"><button type="button" class="pg-btn" id="pg-listen-check">تأیید</button></div>
    </div>

}

function renderSpeakingRound(){

    <div class="pg-q">

function renderPlacementGameResult(){
  const r = _pg.result || {};
  return `<div class="pg"><div class="pg-result">
    <h2>نتیجه بازی تعیین سطح</h2>

    <div style="margin-top:16px;text-align:start;max-width:320px;margin-inline:auto;font-size:14px;font-weight:700;color:var(--navy)">
      <div>گرامر: ${r.writing ?? '—'}</div>
      <div>واژگان: ${r.vocabulary ?? '—'}</div>

    <div style="margin-top:20px"><a class="back" href="#/english">← بازگشت</a></div>
  </div></div>`;

function paintPlacementGame(){
  if(!_pg){ location.hash='#/english'; return; }
  if(_pg.mode==='result'){ app.innerHTML = renderPlacementGameResult(); return; }
  if(pgAllDone() && _pg.mode==='hub'){ pgFinishAndSubmit(); return; }
  if(!_pg.mode || _pg.mode==='hub'){
    app.innerHTML = renderPlacementHub();
    wirePlacementHub();
    return;
  }
  if(_pg.mode==='grammar'){ app.innerHTML = renderGrammarRound(); wireGrammar(); return; }
  if(_pg.mode==='vocab'){ app.innerHTML = renderVocabRound(); wireVocab(); return; }
  if(_pg.mode==='listening'){ app.innerHTML = renderListeningRound(); wireListening(); return; }
  if(_pg.mode==='speaking'){ app.innerHTML = renderSpeakingRound(); wireSpeaking(); return; }
}

function wirePlacementHub(){
  app.querySelectorAll('.pg-cube').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(btn.disabled) return;
      const mode = btn.getAttribute('data-pg');
      btn.classList.add('is-pick');
      setTimeout(()=>{
        _pg.mode = mode;
        _pg.idx = 0;
        _pg.locked = false;
        _pg.vocabPool = [];
        _pg.vocabSlots = [];
        _pg.vocabUsed = [];
        paintPlacementGame();
      }, 700);
    });
  });
}

function pgShowCountdown(sec, done){
  const overlay = document.createElement('div');
  overlay.className = 'pg-countdown';
  overlay.innerHTML = `<b>${sec}</b>`;
  document.body.appendChild(overlay);
  let left = sec;
  const t = setInterval(()=>{
    left--;
    if(left<=0){
      clearInterval(t);
      overlay.remove();
      if(done) done();
    } else {
      overlay.innerHTML = `<b>${left}</b>`;
    }
  }, 1000);
}

function wireGrammar(){
  app.querySelectorAll('.pg-opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(_pg.locked) return;
      _pg.locked = true;
      const oi = +btn.getAttribute('data-oi');
      const item = PG_BANK.grammar[_pg.idx];
      const correct = item.ans;
      pgShowCountdown(4, ()=>{
        app.querySelectorAll('.pg-opt').forEach(b=>{
          const i = +b.getAttribute('data-oi');
          b.disabled = true;
          if(i===correct) b.classList.add('is-correct');
          if(i===oi && oi!==correct) b.classList.add('is-wrong');
        });
        if(oi===correct) _pg.scores.grammar++;
        setTimeout(()=>{
          _pg.idx++;
          _pg.locked = false;
          if(_pg.idx >= PG_BANK.grammar.length){
            _pg.done.grammar = true;
            _pg.mode = 'hub';
          }
          paintPlacementGame();
        }, 900);
      });
    });
  });
}

function wireVocab(){
  function refreshVocabDom(){
    paintPlacementGame();
  }
  function placeLetter(li){
    if(_pg.locked || _pg.vocabUsed[li]) return;
    const empty = _pg.vocabSlots.findIndex(x=>!x);
    if(empty<0) return;
    _pg.vocabSlots[empty] = _pg.vocabPool[li];
    _pg.vocabUsed[li] = true;
    refreshVocabDom();
  }
  function clearSlot(si){
    if(_pg.locked) return;
    const ch = _pg.vocabSlots[si];
    if(!ch) return;
    const li = _pg.vocabUsed.findIndex((u,idx)=>u && _pg.vocabPool[idx]===ch);
    // find exact used index matching this slot char - prefer first used matching
    let found = -1;
    for(let i=0;i<_pg.vocabPool.length;i++){
      if(_pg.vocabUsed[i] && _pg.vocabPool[i]===ch){
        // check not still needed by another slot to the left... simple: free one
        found = i; break;
      }
    }
    // Better: track letter index in slot - store as {ch,li}
    if(found>=0) _pg.vocabUsed[found]=false;
    _pg.vocabSlots[si]='';
    refreshVocabDom();
  }

  app.querySelectorAll('.pg-letter').forEach(btn=>{
    const li = +btn.getAttribute('data-li');
    btn.addEventListener('click', ()=> placeLetter(li));
    btn.addEventListener('dragstart', (e)=>{
      if(_pg.vocabUsed[li]) { e.preventDefault(); return; }
      e.dataTransfer.setData('text/plain', String(li));
      e.dataTransfer.effectAllowed = 'move';
      btn.classList.add('dragging');
    });
    btn.addEventListener('dragend', ()=> btn.classList.remove('dragging'));
    // touch drag
    let touchId = null;
    btn.addEventListener('touchstart', (e)=>{
      if(_pg.vocabUsed[li] || _pg.locked) return;
      touchId = li;
      btn.classList.add('dragging');
    }, {passive:true});
    btn.addEventListener('touchend', (e)=>{
      btn.classList.remove('dragging');
      if(touchId===null) return;
      const t = e.changedTouches[0];
      const el = document.elementFromPoint(t.clientX, t.clientY);
      const slot = el && el.closest ? el.closest('.pg-slot') : null;
      if(slot){
        const si = +slot.getAttribute('data-slot');
        if(!_pg.vocabSlots[si]){
          _pg.vocabSlots[si] = _pg.vocabPool[touchId];
          _pg.vocabUsed[touchId] = true;
          refreshVocabDom();
        }
      } else {
        // tap place sequential
        placeLetter(touchId);
      }
      touchId = null;
    });
  });

  app.querySelectorAll('.pg-slot').forEach(slot=>{
    const si = +slot.getAttribute('data-slot');
    slot.addEventListener('click', ()=> clearSlot(si));
    slot.addEventListener('dragover', (e)=>{ e.preventDefault(); slot.classList.add('drag-over'); });
    slot.addEventListener('dragleave', ()=> slot.classList.remove('drag-over'));
    slot.addEventListener('drop', (e)=>{
      e.preventDefault();
      slot.classList.remove('drag-over');
      const li = +e.dataTransfer.getData('text/plain');
      if(Number.isNaN(li) || _pg.vocabUsed[li]) return;
      if(_pg.vocabSlots[si]) return;
      _pg.vocabSlots[si] = _pg.vocabPool[li];
      _pg.vocabUsed[li] = true;
      refreshVocabDom();
    });
  });

  document.getElementById('pg-vocab-check')?.addEventListener('click', ()=>{
    if(_pg.locked) return;
    const item = PG_BANK.vocab[_pg.idx];
    const formed = (_pg.vocabSlots||[]).join('');
    const ok = formed === item.word;
    _pg.locked = true;
    app.querySelectorAll('.pg-slot').forEach(s=> s.classList.add(ok?'is-ok':'is-bad'));
    if(ok) _pg.scores.vocab++;
    setTimeout(()=>{
      _pg.idx++;
      _pg.locked=false;
      _pg.vocabPool=[]; _pg.vocabSlots=[]; _pg.vocabUsed=[];
      if(_pg.idx >= PG_BANK.vocab.length){ _pg.done.vocab=true; _pg.mode='hub'; }
      paintPlacementGame();
    }, 1000);
  });
}

function wireListening(){
  document.getElementById('pg-listen-play')?.addEventListener('click', ()=>{
    const item = PG_BANK.listening[_pg.idx];
    if(!item) return;
    // آهنگ واقعی اگر audioUrl باشد
    if(item.audioUrl){
      try{
        if(window.__pgAudio){ window.__pgAudio.pause(); }
        window.__pgAudio = new Audio(item.audioUrl);
        window.__pgAudio.play().catch(()=>{});
        return;
      }catch(_){}
    }
    try{
      const u = new SpeechSynthesisUtterance(item.line2);
      u.lang='en-US';
      u.rate = 0.9;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    }catch(_){}
  });
  document.getElementById('pg-listen-check')?.addEventListener('click', ()=>{
    if(_pg.locked) return;
    const item = PG_BANK.listening[_pg.idx];
    const inp = document.getElementById('pg-listen-input');
    const val = inp?.value || '';
    const ok = normalizeLyric(val) === normalizeLyric(item.line2)
      || (normalizeLyric(val).length>10 && normalizeLyric(item.line2).includes(normalizeLyric(val)));
    _pg.locked = true;
    if(inp){ inp.classList.add(ok?'is-ok':'is-bad'); inp.disabled=true; }
    if(ok) _pg.scores.listening++;
    setTimeout(()=>{
      _pg.idx++; _pg.locked=false;
      if(_pg.idx >= PG_BANK.listening.length){ _pg.done.listening=true; _pg.mode='hub'; }
      paintPlacementGame();
    }, 1100);
  });
}

function wireSpeaking(){
  const roundId = _pg.idx;
  let advanced = false;
  function advanceOnce(ok){
    if(advanced || _pg.idx !== roundId) return;
    advanced = true;
    _pg.locked = true;
    if(ok) _pg.scores.speaking++;
    setTimeout(()=>{
      if(_pg.idx !== roundId) return; // already moved
      _pg.idx = roundId + 1;
      _pg.locked = false;
      if(_pg.idx >= PG_BANK.speaking.length){
        _pg.done.speaking = true;
        _pg.mode = 'hub';
      }
      paintPlacementGame();
    }, 1100);
  }

  document.getElementById('pg-speak-hear')?.addEventListener('click', ()=>{
    const item = PG_BANK.speaking[_pg.idx];
    if(!item) return;
    try{
      const u = new SpeechSynthesisUtterance(item.text);
      u.lang='en-US'; speechSynthesis.cancel(); speechSynthesis.speak(u);
    }catch(_){}
  });

  document.getElementById('pg-speak-mic')?.addEventListener('click', ()=>{
    if(_pg.locked || advanced) return;
    const item = PG_BANK.speaking[_pg.idx];
    const status = document.getElementById('pg-speak-status');
    const micBtn = document.getElementById('pg-speak-mic');
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ if(status) status.textContent='مرورگر از تشخیص گفتار پشتیبانی نمی‌کند.'; return; }
    if(micBtn) micBtn.disabled = true;
    const rec = new SR();
    rec.lang='en-US';
    rec.interimResults=false;
    rec.continuous=false;
    rec.maxAlternatives=1;
    if(status) status.textContent='در حال شنیدن...';
    let handled = false;
    rec.onresult = (ev)=>{
      if(handled) return;
      handled = true;
      let said='';
      try{ said = ev.results[0][0].transcript||''; }catch(_){}
      const target = normalizeLyric(item.text);
      const got = normalizeLyric(said);
      const ok = got === target || (got.length>3 && (target.includes(got) || got.includes(target.split(' ').slice(0,3).join(' '))));
      if(status){
        status.textContent = ok ? ('عالی ✓ «'+said+'»') : ('تشخیص: «'+said+'»');
        status.style.color = ok ? '#0c5c41' : '#8f2b21';
      }
      advanceOnce(ok);
    };
    rec.onerror = ()=>{
      if(handled) return;
      handled = true;
      if(status) status.textContent='خطای میکروفون — مرحله بعد';
      if(micBtn) micBtn.disabled = false;
      advanceOnce(false);
    };
    rec.onend = ()=>{
      if(micBtn) micBtn.disabled = false;
      // اگر نتیجه‌ای نیامد، یک‌بار فرصت بده نه پرش خودکار
      if(!handled){
        if(status) status.textContent='چیزی شنیده نشد. دوباره تلاش کن.';
      }
    };
    try{ rec.start(); }catch(_){
      if(status) status.textContent='شروع میکروفون ممکن نشد';
      if(micBtn) micBtn.disabled = false;
    }
  });
}

async function renderPlacementPage(){
  document.body.classList.add('is-placement');
  if(!_pg || !_pg.candidateId){
    openPlacementModal();
    app.innerHTML = `<div class="pg"><p class="pg__sub">ابتدا شماره موبایل را وارد کنید.</p>
      <div style="text-align:center"><button type="button" class="pg-btn" onclick="openPlacementModal()">ورود شماره</button></div></div>`;
    return;
  }
  if(!_pg.mode) _pg.mode = 'hub';
  paintPlacementGame();
}


async function route(){
  stopCarousel();
  stopInlinePlayer();
  const hash = location.hash || '#/';
  const parts = hash.replace(/^#\/?/,'').split('/').filter(Boolean);

  // brand ribbon / sticky placement visibility
  document.body.classList.toggle('is-placement', parts[0]==='placement');
  document.body.classList.toggle('is-english', parts[0]==='english' || parts[0]==='placement');

  /* placement test */
  if(parts[0]==='placement'){
    await renderPlacementPage();
    return;
  }

  /* home */
  if(parts.length===0){
    const page = await fetchPage('home');
    const slides = slotsToCarousel(page) || CAROUSEL;
    const circles = slotsToCircles(page, HOME_CIRCLES);
    // inject dynamic carousel data
    window.__CAROUSEL = slides;
    app.innerHTML = `
      ${renderCarousel(slides)}
      <div class="main">
        ${circlesHtml(circles)}
      </div>`;
    return;
  }

  /* english hub */
  if(parts[0]==='english' && parts.length===1){
    const page = await fetchPage('english');
    const heroImg = (page && page.hero && page.hero.imageUrl) || IMG.lang;
    const circles = slotsToCircles(page, ENGLISH_CIRCLES);
    app.innerHTML = `
      <div class="hero-still"><img src="${heroImg}" alt="زبان انگلیسی"></div>
      <div class="main">
        <div class="sec-title"><h1>${(page&&page.hero&&page.hero.title)||'زبان انگلیسی'}</h1><p>${(page&&page.hero&&page.hero.subtitle)||'مسیر خود را انتخاب کنید'}</p></div>
        <div class="place-cta">
          <h2>سطح زبانت را رایگان مشخص کن</h2>
          <p>آزمون کوتاه حدود ۱۵ دقیقه · نتیجه فوری · بدون ثبت‌نام</p>
          <button type="button" class="place-cta__btn" onclick="openPlacementModal()">شروع تعیین سطح</button>
        </div>
        ${circlesHtml(circles)}
        ${await renderCoursesSection('English')}
        <div style="text-align:center"><a class="back" href="#/">← صفحه اصلی</a></div>
      </div>`;
    wireCourseCards(app);
    return;
  }

  /* english library section or detail */
  if(parts[0]==='english' && ['podcast','stories','musics','books','videos'].includes(parts[1])){
    const key = parts[1];
    if(parts[2]){
      if(key === 'videos'){
        app.innerHTML = `<div class="main">${await renderVideoWatch(parts[2])}</div>`;
        bindVideoWatchClicks(app);
      } else {
        app.innerHTML = `<div class="main">${await renderDetail(key, parts[2])}</div>`;
      }
      return;
    }
    const page = await fetchPage('english-' + key);
    const heroImg = (page && page.hero && page.hero.imageUrl) || CAT_HERO[key];
    const title = (page && page.hero && page.hero.title) || CAT_NAME[key];
    app.innerHTML = `
      <div class="hero-still"><img src="${heroImg}" alt="${title}"></div>
      <div class="main">
        <div class="sec-title"><h1>${title}</h1></div>
        ${await renderLibraryList(key)}
        <div style="text-align:center"><a class="back" href="#/english">← زبان انگلیسی</a></div>
      </div>`;
    /* voice-only podcast: play inline — stay on page, show ring progress */
    app.querySelectorAll('a.circle-wrap[data-voice-only="1"]').forEach(el=>{
      const url = el.getAttribute('data-audio');
      if(!url) return;
      el.addEventListener('click', e=>{
        e.preventDefault();
        e.stopPropagation();
        playAudio(url, el.getAttribute('data-title') || '', el);
      });
    });
    /* educational videos: hover 2s → 10s preview in circle */
    if(key === 'videos'){
      bindVideoHoverPreviews(app);
    }
    return;
  }

  /* other skills — same course-card pattern as English */
  if(['painting','computer','music-skill'].includes(parts[0])){
    const map = {
      painting:{title:'نقاشی', img:IMG.paint, subject:'Painting', pageKey:'painting'},
      computer:{title:'کامپیوتر', img:IMG.code, subject:'Computer', pageKey:'computer'},
      'music-skill':{title:'موسیقی', img:IMG.music, subject:'Music', pageKey:'music'}
    };
    const m = map[parts[0]];
    const page = await fetchPage(m.pageKey);
    const heroImg = (page && page.hero && page.hero.imageUrl) || m.img;
    const title = (page && page.hero && page.hero.title) || m.title;
    const subtitle = (page && page.hero && page.hero.subtitle) || 'دوره‌ها و مسیر یادگیری';
    _courseFilter = null;
    app.innerHTML = `
      <div class="hero-still"><img src="${heroImg}" alt="${title}"></div>
      <div class="main">
        <div class="sec-title"><h1>${title}</h1><p>${subtitle}</p></div>
        ${await renderCoursesSection(m.subject)}
        <div style="text-align:center"><a class="back" href="#/">← صفحه اصلی</a></div>
      </div>`;
    wireCourseCards(app);
    return;
  }

  location.hash = '#/';
}

window.addEventListener('hashchange', route);
route();
